[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "IPy9R"
version = "0.1.0"
description = "smFISH image quantification."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }

authors = [
  { name = "Anna Luo" }
]

keywords = [
  "image-analysis",
  "microscopy",
  "cell-counting",
  "mRNA",
  "starfish",
  "cellprofiler",
  "opencv"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Image Processing"
]

dependencies = [
  "numpy",
  "pandas",
  "PyYAML",
  "tifffile",
  "matplotlib",
  "scikit-image"
]


[project.optional-dependencies]
alignment = [
  "opencv-python"
]

cell-count = [
  "opencv-python"
]

mrna-count = [
  "opencv-python",
  "starfish",
  "slicedimage"
]

dev = [
  "build",
  "validate-pyproject",
  "pytest",
  "ruff",
  "black"
]

all = [
  "opencv-python",
  "starfish",
  "slicedimage"
]


[project.scripts]
ipy2r-run-template-matching = "IPy9R.alignment.run_template_matching:main"
ipy2r-transform-masks = "IPy9R.alignment.transform_masks:main"

ipy2r-preprocess-cellprofiler = "IPy9R.cell_count.preprocess_cellprofiler:main"
ipy2r-analyze-cellcount = "IPy9R.cell_count.analyze_cellcount:main"
ipy2r-compute-stats = "IPy9R.cell_count.compute_stats:main"

ipy2r-structure-data = "IPy9R.mrna_count.structure_data:main"
ipy2r-detect-mrna-spots = "IPy9R.mrna_count.detect_mrna_spots:main"
ipy2r-summarize-spots-barrels = "IPy9R.mrna_count.summarize_spots_barrels:main"
ipy2r-summarize-spots-experiment = "IPy9R.mrna_count.summarize_spots_experiment:main"


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.black]
line-length = 88
target-version = ["py39"]


[tool.ruff]
line-length = 88
target-version = "py39"


[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B"
]
ignore = [
  "E501"
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
